[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name="pyhees"
authors = [
    {name = "Pyhees Development Team"}
]
version="3.10.0"
license = {file = "LICENSE"}

dependencies = [
    "numpy >= 1.26.4",
    "pandas >= 2.1.4",
    "scipy >= 1.11.4",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyhees"]